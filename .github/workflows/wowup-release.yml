name: WowUp Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit zip unzip

      - name: Test and package
        run: ./tools/release.sh --tag "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source tools/addon.sh
          load_addon
          gh release create "$GITHUB_REF_NAME" "dist/$(package_name "$GITHUB_REF_NAME")" \
            --verify-tag --title "$title $version" --notes-file RELEASE_NOTES.md
